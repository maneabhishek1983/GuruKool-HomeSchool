apiVersion: apps/v1
kind: Deployment
metadata:
  name: gurukool-app
  labels:
    app: gurukool-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gurukool-app
  template:
    metadata:
      labels:
        app: gurukool-app
    spec:
      containers:
      - name: app
        image: gurukool/homeschool:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: gurukool-secrets
              key: database-url
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: gurukool-secrets
              key: supabase-url
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: gurukool-secrets
              key: supabase-anon-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gurukool-service
spec:
  selector:
    app: gurukool-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gurukool-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - gurukool.example.com
    secretName: gurukool-tls
  rules:
  - host: gurukool.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gurukool-service
            port:
              number: 80
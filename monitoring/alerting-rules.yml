groups:
  - name: gurukool-alerts
    rules:
      - alert: ApplicationDown
        expr: up{job="gurukool-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "GuruKool application is down"
          description: "The GuruKool application has been down for more than 1 minute."

      - alert: HighResponseTime
        expr: http_request_duration_seconds{job="gurukool-app"} > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "Response time is above 2 seconds for more than 5 minutes."

      - alert: DatabaseConnectionFailed
        expr: up{job="postgres"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Database connection failed"
          description: "Cannot connect to PostgreSQL database."

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Redis cache is down"
          description: "Redis cache service is unavailable."
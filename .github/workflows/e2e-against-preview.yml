name: E2E Against Vercel Preview

# Fires when Vercel posts a deployment_status to GitHub. This is the only
# event that gives us a real preview URL after Vercel has finished building.
# No vercel CLI auth needed in CI — we consume Vercel's webhook.
#
# Setup required (one-time, by repo owner):
#   1. Vercel → Project Settings → Git → enable "GitHub Deployments" /
#      "deployment_status" webhook. Vercel will post a deployment_status
#      event with state=success and target_url=<preview-url> on every push.
#   2. Add repo secrets: VERCEL_PREVIEW_TEST_USER, VERCEL_PREVIEW_TEST_PASSWORD
#      (a pre-existing user in the preview's Supabase project).
#   3. Optional: VERCEL_BYPASS_TOKEN if the preview has password protection.

on:
  deployment_status:

jobs:
  e2e-preview:
    name: E2E against preview URL
    # Only run on successful preview deployments. Prod and failed builds skip.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Resolve preview URL
        id: preview
        run: |
          PREVIEW_URL="${{ github.event.deployment_status.target_url }}"
          if [ -z "$PREVIEW_URL" ]; then
            echo "No target_url on deployment_status — exiting." >&2
            exit 1
          fi
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $PREVIEW_URL"

      - name: Wait for preview to be reachable
        run: npx wait-on --timeout 120000 "${{ steps.preview.outputs.url }}"

      # Contract tests against the real Vercel preview. No DB seeding,
      # no destructive operations — just probes the auth boundary.
      - name: API contract suite
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          # Override Playwright's local webServer — we don't need one.
          PLAYWRIGHT_WEB_SERVER_COMMAND: 'true'
        run: |
          # Skip the webServer entirely by pointing baseURL at the preview.
          PW_TEST_BASE_URL="${{ steps.preview.outputs.url }}" \
          npx playwright test --project=api-contract --config=playwright.preview.config.ts

      # Full UI flow against the preview. Requires a pre-seeded user in the
      # preview's Supabase project (not seeded by CI — too destructive to do
      # against a shared preview database).
      - name: UI smoke against preview
        if: env.VERCEL_PREVIEW_TEST_USER != ''
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          E2E_PREVIEW_USER: ${{ secrets.VERCEL_PREVIEW_TEST_USER }}
          E2E_PREVIEW_PASSWORD: ${{ secrets.VERCEL_PREVIEW_TEST_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_TOKEN }}
          VERCEL_PREVIEW_TEST_USER: ${{ secrets.VERCEL_PREVIEW_TEST_USER }}
        run: |
          PW_TEST_BASE_URL="${{ steps.preview.outputs.url }}" \
          npx playwright test e2e/auth-flow.spec.ts --project=chromium --config=playwright.preview.config.ts

      - name: Upload preview test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-preview-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: Annotate PR
        if: github.event_name == 'deployment_status' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.deployment.sha;
            const url = '${{ steps.preview.outputs.url }}';
            const conclusion = '${{ job.status }}';
            const emoji = conclusion === 'success' ? '✅' : '❌';
            // Find PR by SHA
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });
            for (const pr of prs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `${emoji} E2E against preview \`${url}\` — **${conclusion}**\n\nSee artifacts for the Playwright HTML report.`,
              });
            }
